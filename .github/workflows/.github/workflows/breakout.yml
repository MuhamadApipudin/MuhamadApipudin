name: Generate Breakout

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  generate-breakout:
    permissions:
      contents: write

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Breakout
        uses: cyprieng/github-breakout@v1
        with:
          github_username: MuhamadApipudin
          enable_ghost_bricks: true
          paddle_color: "#2563EB"
          ball_color: "#FFFFFF"
          bricks_colors: "#E5E7EB,#93C5FD,#60A5FA,#3B82F6,#1D4ED8"

      - name: Prepare images
        run: |
          mkdir -p /tmp/breakout-images
          mv output/light.svg /tmp/breakout-images/breakout-light.svg
          mv output/dark.svg /tmp/breakout-images/breakout-dark.svg

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish Breakout
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "chore: update GitHub breakout"
          git push --force origin github-breakout
